name: Release & Update Homebrew

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Tag to release and sync to Homebrew (e.g. v0.1.1)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag-name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create."
          else
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ox
          homebrew-tap: muneebshahid/homebrew-tap
          tag-name: ${{ steps.tag.outputs.name }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
