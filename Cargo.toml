[package]
name = "ox"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A minimal CLI coding agent in Rust with OpenAI Responses API streaming and autonomous tools."
license = "MIT"
repository = "https://github.com/muneebshahid/ox"
homepage = "https://github.com/muneebshahid/ox"
readme = "README.md"
keywords = ["cli", "agent", "openai", "tui", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
futures = "0.3.31"
jsonwebtoken = "10.3.0"
ratatui = "0.29.0"
reqwest = { version = "0.13.1", features = ["json", "stream", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile = "3.25.0"
