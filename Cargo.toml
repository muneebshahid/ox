[package]
name = "ox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.28.1", features = ["event-stream"] }
dotenvy = "0.15.7"
futures = "0.3.31"
jsonwebtoken = "10.3.0"
ratatui = "0.29.0"
reqwest = { version = "0.13.1", features = ["json", "stream", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile = "3.24.0"
